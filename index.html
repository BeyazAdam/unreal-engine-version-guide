<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unreal Engine Version Selector</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Emojis/Icons via CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top, #1e1e38 0%, #0d0d15 100%);
        }
        .glass {
            background: rgba(20, 20, 35, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
        }
        .glass-btn.selected {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.8);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between selection:bg-blue-500 selection:text-white overflow-x-hidden">

    <!-- Top Navigation / Header -->
    <header class="w-full max-w-6xl mx-auto px-6 py-5 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-blue-500/20">
                U
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">UE Selector</h1>
                <p class="text-xs text-slate-500 font-medium">by BeyazAdam</p>
            </div>
        </div>
        
        <!-- Language Selector Button -->
        <button id="langBtn" onclick="toggleLanguage()" class="px-4 py-2 rounded-lg text-xs font-semibold tracking-wider uppercase border border-slate-700 bg-slate-800/50 hover:bg-slate-800 transition-all flex items-center gap-2">
            <i class="fa-solid fa-globe text-blue-400"></i>
            <span id="langText">EN</span>
        </button>
    </header>

    <!-- Main Dynamic Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-8 relative z-10">
        <!-- Background Blur Orbs -->
        <div class="absolute w-80 h-80 rounded-full bg-blue-500/10 blur-[100px] top-1/4 left-1/4 -z-10"></div>
        <div class="absolute w-80 h-80 rounded-full bg-indigo-500/10 blur-[100px] bottom-1/4 right-1/4 -z-10"></div>

        <!-- Main Card -->
        <div id="appCard" class="w-full max-w-xl p-8 md:p-10 rounded-3xl glass shadow-2xl relative overflow-hidden animate-fade-in">
            
            <!-- Step Indicators -->
            <div id="stepper" class="flex justify-between items-center mb-10">
                <div class="flex items-center gap-2">
                    <span class="step-dot w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs bg-blue-600 text-white transition-all">1</span>
                    <span class="text-xs font-semibold text-slate-400" data-tr="Adım 1" data-en="Step 1">Adım 1</span>
                </div>
                <div class="flex-grow mx-4 h-[2px] bg-slate-800 rounded-full">
                    <div id="progressBar" class="h-full bg-gradient-to-r from-blue-600 to-indigo-600 w-0 transition-all duration-300"></div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-slate-500" id="stepIndicator">1 / 3</span>
                </div>
            </div>

            <!-- Content Body -->
            <div id="questionContainer" class="space-y-6">
                <!-- Dynamic Question Title -->
                <h2 id="questionTitle" class="text-2xl md:text-3xl font-extrabold text-white leading-tight"></h2>
                
                <!-- Dynamic Options -->
                <div id="optionsGrid" class="grid grid-cols-1 gap-4 pt-2">
                    <!-- Buttons will inject here -->
                </div>
            </div>

            <!-- Result Container (Hidden Initially) -->
            <div id="resultContainer" class="hidden space-y-6">
                <div class="text-center space-y-2">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-500/10 text-green-400 mb-2 border border-green-500/20">
                        <i class="fa-solid fa-square-poll-vertical text-2xl"></i>
                    </div>
                    <h3 class="text-sm font-semibold tracking-widest text-blue-400 uppercase" data-tr="Önerilen Sürümünüz" data-en="Your Recommended Version">Önerilen Sürümünüz</h3>
                    <h2 id="resultVersion" class="text-4xl md:text-5xl font-black text-white bg-gradient-to-r from-blue-400 via-indigo-200 to-white bg-clip-text text-transparent">UE 5.4.4</h2>
                    <p id="resultSlogan" class="text-sm text-slate-400 italic font-medium"></p>
                </div>

                <!-- Explanation Box -->
                <div class="p-5 rounded-2xl bg-slate-900/50 border border-slate-800 space-y-3">
                    <h4 class="text-sm font-bold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-circle-info text-blue-400"></i>
                        <span data-tr="Neden Bu Sürüm?" data-en="Why This Version?">Neden Bu Sürüm?</span>
                    </h4>
                    <p id="resultReason" class="text-sm text-slate-400 leading-relaxed"></p>
                </div>

                <!-- Critical Features list -->
                <div class="space-y-3">
                    <h4 class="text-sm font-bold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>
                        <span data-tr="Önemli Özellikler & Avantajlar" data-en="Key Features & Advantages">Önemli Özellikler & Avantajlar</span>
                    </h4>
                    <ul id="resultFeatures" class="space-y-2 text-sm text-slate-400">
                        <!-- Dynamic list items -->
                    </ul>
                </div>

                <!-- Buttons Area -->
                <div class="pt-4 flex flex-col sm:flex-row gap-3">
                    <button onclick="restartQuiz()" class="w-full py-4 rounded-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-lg shadow-blue-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span data-tr="Tekrar Çöz" data-en="Restart Selector">Tekrar Çöz</span>
                    </button>
                    <a href="https://github.com/BeyazAdam" target="_blank" class="w-full py-4 rounded-xl font-bold border border-slate-700 hover:border-slate-500 bg-slate-800/40 text-slate-300 hover:text-white transition-all flex items-center justify-center gap-2">
                        <i class="fa-brands fa-github"></i>
                        <span data-tr="Rehberi GitHub'da Gör" data-en="View Guide on GitHub">Rehberi GitHub'da Gör</span>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-slate-600 border-t border-slate-900 bg-slate-950/20 z-10">
        <p>
            &copy; 2026 Crafted with <i class="fa-solid fa-heart text-red-500/80 mx-0.5"></i> by 
            <a href="https://github.com/BeyazAdam" target="_blank" class="font-semibold text-slate-400 hover:text-blue-400 transition-colors">BeyazAdam</a>
        </p>
    </footer>

    <!-- App Logic script -->
    <script>
        let currentLanguage = 'tr';
        let currentStep = 0;
        let selections = {
            genre: '',
            platform: '',
            team: ''
        };

        const localization = {
            tr: {
                langText: "EN",
                steps: ["Adım 1", "Adım 2", "Adım 3"],
                questions: [
                    {
                        title: "Geliştirdiğiniz oyunun türü nedir?",
                        field: "genre",
                        options: [
                            { text: "Açık Dünya & Simülasyon", value: "openworld" },
                            { text: "Mobil & Stilize / Toon", value: "stylized" },
                            { text: "Sinematik & AAA Grafik", value: "aaa" },
                            { text: "Klasik Indie veya 2D Oyunlar", value: "indie" }
                        ]
                    },
                    {
                        title: "Hedeflediğiniz ana platform hangisidir?",
                        field: "platform",
                        options: [
                            { text: "Yüksek Donanımlı PC (Steam) & Konsol", value: "highpc" },
                            { text: "Mobil (Android/iOS) & El Konsolu", value: "mobile" },
                            { text: "Eski Donanımlar & Web (HTML5)", value: "lowpc" }
                        ]
                    },
                    {
                        title: "Ekip boyutunuz ve geliştirici donanımınız ne durumda?",
                        field: "team",
                        options: [
                            { text: "Solo Geliştirici & Düşük/Orta Sistem", value: "solo" },
                            { text: "Küçük-Orta Ekip & İyi Performanslı PC", value: "midteam" },
                            { text: "Stüdyo & Profesyonel Donanımlar", value: "studio" }
                        ]
                    }
                ]
            },
            en: {
                langText: "TR",
                steps: ["Step 1", "Step 2", "Step 3"],
                questions: [
                    {
                        title: "What is your game's genre?",
                        field: "genre",
                        options: [
                            { text: "Open World & Simulation", value: "openworld" },
                            { text: "Mobile & Stylized / Toon", value: "stylized" },
                            { text: "Cinematic & AAA Quality", value: "aaa" },
                            { text: "Classic Indie or 2D Games", value: "indie" }
                        ]
                    },
                    {
                        title: "What is your primary target platform?",
                        field: "platform",
                        options: [
                            { text: "High-End PC (Steam) & Consoles", value: "highpc" },
                            { text: "Mobile (Android/iOS) & Handhelds", value: "mobile" },
                            { text: "Low-end PCs, Legacy Tech & Web", value: "lowpc" }
                        ]
                    },
                    {
                        title: "What is your team size and hardware situation?",
                        field: "team",
                        options: [
                            { text: "Solo Developer & Low-to-Mid PC", value: "solo" },
                            { text: "Small-to-Medium Team & Powerful PC", value: "midteam" },
                            { text: "Studio & Professional Grade Hardware", value: "studio" }
                        ]
                    }
                ]
            }
        };

        const resultDatabase = {
            "UE 5.8.0": {
                slogans: {
                    tr: "🌌 Geleceğin Teknolojisi, Sınırsız Özgürlük",
                    en: "🌌 Technology of the Future, Limitless Freedom"
                },
                reasons: {
                    tr: "Gelişmiş Mesh Terrain teknolojisi ve devasa sahnelerde performansı öldürmeyen MegaLights desteği sayesinde, yüksek donanımlı dikey açık dünyalar ve yeni nesil AAA projeleri için en elverişli sürümdür.",
                    en: "Thanks to advanced Mesh Terrain technology and MegaLights support that preserves performance in massive scenes, this is the ultimate version for next-gen AAA projects and high-end vertical open worlds."
                },
                features: {
                    tr: [
                        "Mesh Terrain: Dikey arazileri sınır olmadan biçimlendirin.",
                        "MegaLights: Yüzlerce dinamik gölge veren ışığı aynı anda yönetin.",
                        "Lumen Lite: Mobil ve alt segment cihazlar için hafifletilmiş küresel aydınlatma."
                    ],
                    en: [
                        "Mesh Terrain: Sculpt vertical landscapes without conventional grid boundaries.",
                        "MegaLights: Manage hundreds of dynamic shadow-casting lights simultaneously.",
                        "Lumen Lite: Lightweight global illumination optimized for mobile & handhelds."
                    ]
                }
            },
            "UE 5.4.4": {
                slogans: {
                    tr: "⚓ Solo Geliştiricinin Güvenli Limanı",
                    en: "⚓ The Safe Harbor for Solo Devs"
                },
                reasons: {
                    tr: "Gereksiz çökmelerden arındırılmış, uzun süre test edilmiş kararlı yapısı ve mükemmel PCG (Procedural Content Generation) araç setiyle solo geliştiriciler için en güvenli ve verimli Unreal Engine 5 sürümüdür.",
                    en: "Free of unstable experimental crashes, heavily patched, and boasting an excellent PCG toolset, this is the safest and most efficient Unreal Engine 5 build for solo developers."
                },
                features: {
                    tr: [
                        "Yüksek Kararlılık: En az çöken ve hata barındıran UE5 sürümü.",
                        "PCG Biome Core: Spline tabanlı ve prosedürel çevre yerleşimi.",
                        "Neural Network Engine (NNE): Oyun içi yapay zeka entegrasyon desteği."
                    ],
                    en: [
                        "High Stability: The least bug-ridden and most stable UE5 production build.",
                        "PCG Biome Core: Smooth spline-following and procedural scene decoration.",
                        "Neural Network Engine (NNE): Out-of-the-box support for runtime AI models."
                    ]
                }
            },
            "UE 5.3": {
                slogans: {
                    tr: "🎬 Sinematik Deha ve Detay Canavarı",
                    en: "🎬 Cinematic Genius & Detail Monster"
                },
                reasons: {
                    tr: " AAA kalitesinde duman/ateş efektleri (VDB) ve sinematik saç/kürk fiziği desteği sayesinde görsel sınırları zorlayan kısa filmler ve karakter odaklı AAA macera oyunları için mükemmeldir.",
                    en: "Perfect for visually striking cinematics, short films, and character-driven AAA experiences due to its advanced sparse volume texture (VDB) integration and hair/fur strand physics."
                },
                features: {
                    tr: [
                        "Volumetric Cloud & Fog: Gerçekçi duman ve gökyüzü simülasyonları.",
                        "Strands Physics: Üst düzey saç, kürk ve kumaş simülasyonu.",
                        "Sanal Prodüksiyon Araçları: Profesyonel stüdyo entegrasyonu."
                    ],
                    en: [
                        "Volumetric Cloud & Fog: Realistic cloud rendering and cinematic fog sheets.",
                        "Strands Physics: High-fidelity hair, fur, and cloth simulation.",
                        "Virtual Production tools: Professional grade studio hardware integration."
                    ]
                }
            },
            "UE 4.27": {
                slogans: {
                    tr: "🛡️ Eski Dost, Kaya Gibi Stabil",
                    en: "🛡️ Old Friend, Rock-Solid"
                },
                reasons: {
                    tr: "Eski mobil cihazlarda ve düşük bütçeli 2D/Toon projelerde performans kaybını en aza indiren, derleme boyutu en küçük olan ve sektörde yıllarca rüştünü ispatlamış efsanevi sürüm.",
                    en: "A legendary version proven over years in the industry, offering the smallest package size and optimal performance for low-end mobile hardware or legacy 2D/toon projects."
                },
                features: {
                    tr: [
                        "Minimum Derleme Boyutu: Mobil platformlar için en küçük paket boyutu.",
                        "Kaya Gibi Stabil: Çökmesiz, hatasız editör deneyimi.",
                        "Forward Renderer: Mobil GPU dostu ışıklandırma ve performans."
                    ],
                    en: [
                        "Minimal Shipping Size: Smallest possible package footprint for mobile pipelines.",
                        "Rock-Solid: A bug-free editor experience optimized for simple setups.",
                        "Forward Renderer: Extremely low GPU overhead rendering."
                    ]
                }
            }
        };

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'tr' ? 'en' : 'tr';
            document.documentElement.lang = currentLanguage;
            document.getElementById('langText').innerText = localization[currentLanguage].langText;
            
            // Translate static elements
            document.querySelectorAll('[data-tr]').forEach(el => {
                el.innerText = el.getAttribute(`data-${currentLanguage}`);
            });
            
            updateStep();
        }

        function updateStep() {
            const langData = localization[currentLanguage];
            const stepInfo = langData.questions[currentStep];
            
            // Progress Bar & Indicators
            const progressPct = (currentStep / 3) * 100;
            document.getElementById('progressBar').style.width = `${progressPct}%`;
            document.getElementById('stepIndicator').innerText = `${currentStep + 1} / 3`;
            
            // Stepper Dot Text
            const stepperDot = document.querySelector('.step-dot');
            stepperDot.innerText = currentStep + 1;
            stepperDot.nextElementSibling.innerText = langData.steps[currentStep];

            // Question Title
            document.getElementById('questionTitle').innerText = stepInfo.title;

            // Options Grid
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';

            stepInfo.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-5 rounded-2xl glass-btn text-base font-semibold flex justify-between items-center group relative overflow-hidden";
                btn.innerHTML = `
                    <span>${opt.text}</span>
                    <i class="fa-solid fa-arrow-right text-slate-600 group-hover:text-blue-400 group-hover:translate-x-1 transition-all"></i>
                `;
                btn.onclick = () => selectOption(stepInfo.field, opt.value);
                optionsGrid.appendChild(btn);
            });
        }

        function selectOption(field, value) {
            selections[field] = value;
            if (currentStep < 2) {
                currentStep++;
                // Add minor slide animation transition
                const card = document.getElementById('appCard');
                card.classList.remove('animate-fade-in');
                void card.offsetWidth; // Trigger reflow
                card.classList.add('animate-fade-in');
                updateStep();
            } else {
                calculateResult();
            }
        }

        function calculateResult() {
            let finalSelection = "UE 5.4.4"; // Default fallback

            // Decision Logic
            if (selections.genre === "openworld" && selections.platform === "highpc") {
                finalSelection = "UE 5.8.0";
            } else if (selections.genre === "stylized" && selections.platform === "mobile") {
                // If it's a mobile toon project, we provide choice depending on team hardware
                finalSelection = selections.team === "solo" ? "UE 4.27" : "UE 5.8.0";
            } else if (selections.genre === "aaa" || selections.team === "studio") {
                finalSelection = selections.platform === "highpc" ? "UE 5.8.0" : "UE 5.3";
            } else if (selections.genre === "indie" || selections.team === "solo") {
                finalSelection = "UE 5.4.4";
            }

            displayResult(finalSelection);
        }

        function displayResult(version) {
            document.getElementById('questionContainer').classList.add('hidden');
            document.getElementById('stepper').classList.add('hidden');
            
            const resultBox = document.getElementById('resultContainer');
            resultBox.classList.remove('hidden');

            // Set result content based on database and language
            const dbEntry = resultDatabase[version];
            document.getElementById('resultVersion').innerText = version;
            document.getElementById('resultSlogan').innerText = dbEntry.slogans[currentLanguage];
            document.getElementById('resultReason').innerText = dbEntry.reasons[currentLanguage];

            const featuresList = document.getElementById('resultFeatures');
            featuresList.innerHTML = '';
            dbEntry.features[currentLanguage].forEach(feat => {
                const li = document.createElement('li');
                li.className = "flex items-start gap-2.5 leading-relaxed";
                li.innerHTML = `
                    <i class="fa-solid fa-circle-check text-green-500 mt-1"></i>
                    <span>${feat}</span>
                `;
                featuresList.appendChild(li);
            });

            // Transition effect
            const card = document.getElementById('appCard');
            card.classList.remove('animate-fade-in');
            void card.offsetWidth;
            card.classList.add('animate-fade-in');
        }

        function restartQuiz() {
            currentStep = 0;
            selections = { genre: '', platform: '', team: '' };
            
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('questionContainer').classList.remove('hidden');
            document.getElementById('stepper').classList.remove('hidden');
            
            updateStep();
        }

        // Initialize App
        updateStep();
    </script>
</body>
</html>
